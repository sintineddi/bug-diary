[project]
name = "bugdiary"
version = "0.1.0"
description = "Keeps a diary of the bugs you fixed, and reads it back before you repeat one."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bugdiary = "bugdiary.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bugdiary"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["bench/cache", "bench/results"]
